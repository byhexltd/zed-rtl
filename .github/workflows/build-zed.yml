name: build-zed
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile release-fast -p zed
      - uses: actions/upload-artifact@v4
        with:
          name: zed-windows
          path: target/release-fast/zed.exe